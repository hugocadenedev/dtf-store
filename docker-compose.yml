services:
  # ─── Database Migrations ─────────────────────────────────────────
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: dtf-store-migrator
    env_file: .env.production
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/production.db

  # ─── Next.js App ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtf-store-app
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3000:3000"
    volumes:
      # Persist uploads & SQLite database outside the container
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
    networks:
      - dtf-network

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dtf-store-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - dtf-network

  # ─── Certbot (SSL Let's Encrypt) ────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: dtf-store-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew certificates automatically every 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  dtf-network:
    driver: bridge
